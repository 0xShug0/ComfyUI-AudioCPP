name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The tests run the nodes against a stand-in HTTP server with audiocpp_server's response shapes (no model, no GPU). The checks
# against a real audiocpp_server (tests/test_real_server.py) run when AUDIOCPP_TEST_PORT is set, which CI does not do.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        comfyui: ["v0.42.1"]
        include:
          - os: ubuntu-24.04
            comfyui: "v0.38.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ComfyUI-AudioCPP
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: ComfyUI checkout (pinned)
        run: |
          git -c core.autocrlf=false clone --quiet --depth 1 --branch "${{ matrix.comfyui }}" https://github.com/Comfy-Org/ComfyUI.git ComfyUI
          $pinned = @{ 'v0.38.0' = '6b747c0428c343e1417219641db93a4fb7cb69ae'; 'v0.42.1' = '63be2f9b82ad0dac88a7ceaa28a9cf3154125a18' }["${{ matrix.comfyui }}"]
          if (-not $pinned -or (git -C ComfyUI rev-parse HEAD) -ne $pinned) { throw "ComfyUI commit mismatch" }

      - name: Install (CPU)
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          # CPU torch first, so that ComfyUI's unpinned torch requirement does not pull the CUDA build
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt pytest ruff

      - name: Lint
        working-directory: ComfyUI-AudioCPP
        run: ruff check .

      - name: Tests
        working-directory: ComfyUI-AudioCPP
        env:
          AUDIOCPP_COMFYUI_DIR: ${{ github.workspace }}/ComfyUI
        run: python -m pytest -v

      - name: ComfyUI loads the nodes
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -Recurse ComfyUI-AudioCPP ComfyUI/custom_nodes/ComfyUI-AudioCPP
          $log = Join-Path $env:RUNNER_TEMP comfyui.log
          $p = Start-Process python -ArgumentList "main.py", "--cpu", "--listen", "127.0.0.1", "--port", "8188" -WorkingDirectory ComfyUI -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          try {
            $info = $null
            for ($i = 0; $i -lt 120 -and -not $info; $i++) {
              Start-Sleep 2
              try { $info = Invoke-RestMethod http://127.0.0.1:8188/object_info -TimeoutSec 10 } catch {}
            }
            foreach ($node in "AudioCPPServer", "AudioCPPDoctor", "AudioCPPTextToSpeech") {
              if (-not $info -or -not $info.$node) { Get-Content $log, "$log.err"; throw "$node is not registered" }
            }
            "all 3 nodes registered"
          } finally {
            Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          }
